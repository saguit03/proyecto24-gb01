name: Learning actions

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target environment (dev, pre, pro)'
        required: true
        type: choice
        options:
          - dev
          - pre
          - pro

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment || 'dev' }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2
          
      - name: Build and start services with Docker Compose
        run: |
          docker compose up -d
