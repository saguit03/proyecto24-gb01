name: Docker Deployment

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target environment (dev, pre, pro)'
        required: true
        type: choice
        options:
          - dev
          - pre
          - pro

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment || 'dev' }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login -u ${{ github.actor }} --password-stdin

      - name: Build and Tag Docker Image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/app:${{ github.event.inputs.target_environment || 'dev' }}
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Deploy with Docker Compose
        run: |
          export IMAGE_NAME=ghcr.io/${{ github.repository }}/app:${{ github.event.inputs.target_environment || 'dev' }}
          docker compose up -d
